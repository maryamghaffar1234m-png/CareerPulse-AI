<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CareerPulse AI - AI-powered CV analysis and career recommendations.">
<meta name="keywords" content="AI, career, CV, skills, job matching">
<meta name="author" content="Maryam Ghaffar">
<meta property="og:title" content="CareerPulse AI">
<meta property="og:description" content="Find your perfect career match with AI.">
    <meta name="google-site-verification" content="q68QcsKr6EGXhDZgBmRxVacGGgtJ5EBbspK7kEu2MSo" />
    <title>CareerPulse AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">
    <style>
        body { font-family: 'Inter', sans-serif; margin: 0; background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); color: white; min-height: 100vh; }
        .container { max-width: 900px; margin: 0 auto; padding: 50px 20px; }
        h1 { font-weight: 800; font-size: 42px; text-align: center; margin-bottom: 10px; }
        .highlight { background: linear-gradient(90deg, #00c6ff, #0072ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p.tagline { text-align: center; color: #b0b0b0; margin-bottom: 40px; }

        .upload-box { background: rgba(255,255,255,0.1); padding: 30px; border-radius: 20px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); margin-bottom: 30px; }
        input[type="file"] { background: #24243e; border: none; padding: 10px; color: white; margin-bottom: 20px; width: 100%; box-sizing: border-box; border-radius: 10px; }
        button { width: 100%; padding: 15px; font-size: 18px; font-weight: 600; background: linear-gradient(90deg, #00c6ff, #0072ff); border: none; color: white; border-radius: 50px; cursor: pointer; transition: 0.3s; }
        button:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0, 114, 255, 0.4); }
        
        .spinner { display: none; margin: 20px auto; width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Results Section */
        #results { display: none; margin-top: 40px; }
        .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; padding: 20px; margin-bottom: 20px; }
        h3 { color: #00c6ff; }
        .summary-box, .skills-box { margin-bottom: 20px; }
        .skill-tag { display: inline-block; background: #302b63; border: 1px solid #00c6ff; padding: 5px 10px; border-radius: 20px; margin: 4px; font-size: 14px; }
        .job-title { display: flex; justify-content: space-between; align-items: center; }
        .progress-bar { background: #444; height: 10px; border-radius: 10px; margin-top: 10px; }
        .progress-fill { height: 10px; border-radius: 10px; background: linear-gradient(90deg, #00c6ff, #0072ff); }
        .green-box { background: #1a4d2e; padding: 10px; border-radius: 5px; color: #7dfa9a; margin-top: 10px; }
        .red-box { background: #4d1a1a; padding: 10px; border-radius: 5px; color: #fa7d7d; margin-top: 10px; }
                .hero-title {
            font-weight: 800;
            font-size: 48px;
            text-align: center;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #ffffff, #00c6ff);
            -webkit-background-clip: text;
            background-clip: text; /* Ye line add ki hai */
            -webkit-text-fill-color: transparent;
        }
        .highlight {
            background: linear-gradient(90deg, #00c6ff, #0072ff);
            -webkit-background-clip: text;
            background-clip: text; /* Ye line add ki hai */
            -webkit-text-fill-color: transparent;
        }
    </style>

</head>
<body>
    <div class="container">
                <h1 class="hero-title">Career<span class="highlight">Pulse</span> AI</h1>
        <p class="tagline">Our AI analyzes your education, experience, and skills to recommend the perfect career paths and highlight your skill gaps.</p>

        <div class="upload-box">
            <input type="file" id="cvFile" accept=".pdf,.docx,.jpg,.jpeg,.png">
            <button id="btn" onclick="analyze()">Analyze My Career Potential</button>
            <div class="spinner" id="loading"></div>
        </div>

        <div id="results"></div>
    </div>

    <script>
        async function analyze() {
            const fileInput = document.getElementById('cvFile');
            const output = document.getElementById('results');
            const btn = document.getElementById('btn');
            const loader = document.getElementById('loading');

            if (!fileInput.files[0]) { alert("Please upload a CV PDF first!"); return; }

            btn.style.display = "none";
            loader.style.display = "block";
            output.style.display = "none";

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            try {
                const res = await fetch('/upload-cv/', { method: 'POST', body: formData });
                const data = await res.json();

                // 1. Summary and Experience
                let html = `<div class="card"><h3>📋 Profile Summary</h3><p>${data.summary}</p><p><strong>Experience:</strong> ${data.experience}</p></div>`;
                
                // 2. Extracted Skills
                html += `<div class="card"><h3>🛠️ Extracted Skills</h3><div class="skills-box">`;
                data.user_skills.forEach(skill => { html += `<span class="skill-tag">${skill}</span>`; });
                html += `</div></div>`;

                // 3. Job Matches
                html += `<h2 style="margin-top:20px;">🎯 Recommended Careers</h2>`;
                
                data.job_matches.forEach(job => {
                    let color = job.matched_percentage >= 40 ? "green-box" : "red-box";
                    let future = job.missing_skills.length > 0 ? job.missing_skills.join(", ") : "None, you are fully ready!";
                    
                    html += `
                    <div class="card">
                        <div class="job-title">
                            <h3>${job.title}</h3>
                            <strong style="color: #00c6ff;">${job.matched_percentage}% Match</strong>
                        </div>
                        <p>${job.description}</p>
                        <p><strong>💰 Salary Range:</strong> ${job.salary_range}</p>
                        
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${job.matched_percentage}%;"></div>
                        </div>
                        
                        <div class="${color}">
                            <strong>Future Skills to Learn (Gap):</strong> ${future}
                        </div>
                    </div>`;
                });

                output.innerHTML = html;
                output.style.display = "block";

            } catch (err) {
                output.innerHTML = "Error analyzing CV: " + err;
                output.style.display = "block";
            } finally {
                btn.style.display = "block";
                loader.style.display = "none";
            }
        }
    </script>
</body>
</html>
